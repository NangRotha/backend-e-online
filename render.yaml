# ============================================================
# Render Blueprint — Deploy Backend (FastAPI) លើ Render — 🐳 Docker
# ============================================================
# 🐳 Runtime = **Docker** (`Dockerfile` ក្នុង repo នេះ) — Python 3.12-slim
#    ដូច្នេះមិនត្រូវការ Env Var `PYTHON_VERSION` ទេ (កំណត់ក្នុង Dockerfile)
#
# 🗄️  Database = **SQLite តែមួយប៉ុណ្ណោះ** (គ្មាន PostgreSQL ទៀតទេ)
#     • Free plan  → `/var/data` នៅក្នុង Container (Ephemeral)
#                    ⚠️ ទិន្នន័យបាត់ពេល Redeploy/Restart (ល្មមសម្រាប់សាកល្បង)
#     • Starter+   → ដោះ Comment `disk:` ខាងក្រោម (mount នៅ `/var/data`)
#                    ទិន្នន័យ និងរូបភាព **មិនបាត់** ពេល Redeploy ✓
#                    (Dockerfile កំណត់ SQLITE_PATH/UPLOAD_DIR = /var/data រួចហើយ)
#
# ⚠️ ចំណាំសំខាន់:
#    • មិនត្រូវការ `DATABASE_URL` / `DB_ENGINE` ទៀតទេ — Backend ប្រើ SQLite ជានិច្ច
#    • Render **មិនគាំទ្រ key `pythonVersion`** ក្នុង render.yaml ទេ
#      (Schema កំណត់ `additionalProperties: false` → Blueprint នឹងត្រូវបដិសេធ)
#
# របៀបប្រើ:
#   1. Push code ទៅ GitHub (`Dockerfile` + `render.yaml` + `requirements.txt` នៅ root)
#   2. Render Dashboard -> New -> Blueprint -> ជ្រើស repo នេះ
#   3. បំពេញ Env Var ដែលមាន `sync: false` (SECRET_KEY បង្កើតដោយស្វ័យប្រវត្តិ)
#   4. **Admin ដំបូង**: ដាក់ `ADMIN_EMAIL` + `ADMIN_PASSWORD` → បង្កើតពេល Startup
#      ⚠️ Free plan គ្មាន Shell/SSH → រត់ `create_admin.py` មិនបានទេ
#
# ចំណាំ:
#   - Free plan បិទ port 25/465/587 → ប្រើ `BREVO_API_KEY` (HTTPS) សម្រាប់ OTP/Receipt
#   - WebSocket real-time ត្រូវការ Single Instance (កុំ Scale ច្រើន)
#   - Region `singapore` ជិតកម្ពុជាជាងគេ (oregon · ohio · virginia · frankfurt · singapore)
# ============================================================
services:
  - type: web
    name: backend-e-online
    runtime: docker                        # 🐳 Docker — Build តាម Dockerfile ក្នុង repo នេះ
    dockerfilePath: ./Dockerfile
    region: singapore          # ជិតកម្ពុជាជាងគេ (oregon · ohio · virginia · frankfurt · singapore)
    # ⚠️ បើ Service មានរួច ហើយនៅ Region ផ្សេង → Render មិនអនុញ្ញាតប្តូរ Region ទេ
    #    (ត្រូវបង្កើត Service ថ្មី ឬលុបបន្ទាត់ `region:` នេះចេញ)
    # ℹ️ ប្តូរពី `runtime: python` → `docker`៖ ត្រូវបង្កើត Service ថ្មី ឬកំណត់
    #    Settings -> Runtime = Docker ក្នុង Dashboard
    plan: free                 # ប្តូរទៅ `starter` បើចង់បន្ថែម Persistent Disk (OPTION B)
    autoDeploy: true
    # ℹ️ Docker មិនត្រូវការ `buildCommand`/`startCommand` ទេ — កំណត់ក្នុង Dockerfile
    #    (CMD: uvicorn --port $PORT --workers 1 --proxy-headers)
    healthCheckPath: /health

    # ============================================================
    # Persistent Disk (mount នៅ `/var/data`)
    # ទិន្នន័យ (ecommerce.db) និងរូបភាព Upload មិនបាត់ពេល Redeploy ✓
    # ============================================================
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      # Render កំណត់ RENDER=true ដោយស្វ័យប្រវត្តិ
      - key: SECRET_KEY
        generateValue: true
      # 🗄️ Database = SQLite (កំណត់ក្នុង Dockerfile: SQLITE_PATH=/var/data/ecommerce.db)
      # Free plan គ្មាន Disk -> /var/data នៅក្នុង Container (Ephemeral)
      # ⚠️ ទិន្នន័យបាត់ពេល Redeploy/Restart — ប្រើ OPTION B (Disk) ដើម្បីកុំបាត់
      #
      # (ជម្រើស) បើចង់ override ទីតាំង DB/Uploads ដោយខ្លួនឯង — ដោះ Comment ខាងក្រោម:
      # - key: SQLITE_PATH
      #   value: /var/data/ecommerce.db
      # - key: UPLOAD_DIR
      #   value: /var/data/uploads
      # 👤 Admin ដំបូង — បង្កើតដោយស្វ័យប្រវត្តិពេល Startup
      # (ចាំបាច់លើ Free plan ព្រោះគ្មាន Shell ដើម្បីរត់ `create_admin.py`)
      # ឧ. ADMIN_EMAIL=admin@mystore.com · ADMIN_PASSWORD=ពាក្យសម្ងាត់វែងៗ
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # CORS — Origin របស់ Frontend (Vercel) · មិនមែន Secret -> ដាក់តម្លៃជាមុនបាន
      - key: CORS_ORIGINS
        value: "https://frontend-user-e-online.vercel.app,https://frontend-admin-e-online.vercel.app"
      # Regex សម្រាប់ Vercel Preview URL ដែលផ្លាស់ប្តូររាល់ពេល Deploy
      - key: CORS_ORIGIN_REGEX
        value: '^https://frontend-(user|admin)-e-online.*\.vercel\.app$'
      # ✉️ Email / OTP — ប្រើ **Brevo HTTP API** (HTTPS port 443)
      # ⚠️ Render Free plan បិទ port 25/465/587 → SMTP ប្រើមិនបានទេ
      # ⚠️ `SMTP_FROM` ត្រូវតែជាអ៊ីមែលដែលបាន **Verify** ក្នុង Brevo
      #    (កូដប្រើវាជា "អ្នកផ្ញើ" ទាំង Brevo API និង SMTP)
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: BREVO_API_KEY
        sync: false
      # បើប្រើ SMTP ពិត (Plan បង់ ឬ Server ខាងក្រៅ) — ដោះ Comment ១០ បន្ទាត់ខាងក្រោម:
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   sync: false
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: SMTP_USE_SSL
      #   sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # Cloudinary — រក្សាទុករូបភាព/វីដេអូ Upload ឱ្យមានស្ថេរភាព
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # UploadThing — ផ្ទុករូបភាព/វីដេអូ Upload លើ CDN អចិន្ត្រៃយ៍
      - key: UPLOADTHING_TOKEN
        sync: false
      # ABA Pay / KHQRcc — Scan & Pay QR
      - key: KHQRCC_PROFILE_ID
        sync: false
      - key: KHQRCC_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://frontend-user-e-online.vercel.app
