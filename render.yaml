# ============================================================
# Render Blueprint — Deploy Backend (FastAPI) លើ Render
# ============================================================
# 🗄️  Database = **SQLite តែមួយប៉ុណ្ណោះ** (គ្មាន PostgreSQL ទៀតទេ)
#     • Free plan  → ឯកសារ DB ស្ថិតក្នុង Service Folder (Ephemeral)
#                    ⚠️ ទិន្នន័យបាត់ពេល Redeploy/Restart (ល្មមសម្រាប់សាកល្បង)
#     • Starter+   → ដោះ Comment `disk:` + `SQLITE_PATH` + `UPLOAD_DIR` (OPTION B)
#                    ទិន្នន័យ និងរូបភាព **មិនបាត់** ពេល Redeploy
#
# ⚠️ ចំណាំសំខាន់:
#    • Render **មិនគាំទ្រ key `pythonVersion`** ក្នុង render.yaml ទេ
#      (Schema កំណត់ `additionalProperties: false` → Blueprint នឹងត្រូវបដិសេធ)
#      → Python Version កំណត់ដោយឯកសារ `.python-version` នៅ root (= 3.12)
#        ឬ Env Var `PYTHON_VERSION=3.12.10` (សម្រាប់ Manual Web Service តែប៉ុណ្ណោះ)
#    • មិនត្រូវការ `DATABASE_URL` / `DB_ENGINE` ទៀតទេ — Backend ប្រើ SQLite ជានិច្ច
#
# របៀបប្រើ:
#   1. Push code ទៅ GitHub (`render.yaml` + `requirements.txt` + `.python-version` នៅ root)
#   2. Render Dashboard -> New -> Blueprint -> ជ្រើស repo នេះ
#   3. បំពេញ Env Var ដែលមាន `sync: false` (SECRET_KEY បង្កើតដោយស្វ័យប្រវត្តិ)
#   4. **Admin ដំបូង**: ដាក់ `ADMIN_EMAIL` + `ADMIN_PASSWORD` → បង្កើតពេល Startup
#      ⚠️ Free plan គ្មាន Shell/SSH → រត់ `create_admin.py` មិនបានទេ
#
# ចំណាំ:
#   - Free plan បិទ port 25/465/587 → ប្រើ `BREVO_API_KEY` (HTTPS) សម្រាប់ OTP/Receipt
#   - WebSocket real-time ត្រូវការ Single Instance (កុំ Scale ច្រើន)
#   - Region `singapore` ជិតកម្ពុជាជាងគេ (oregon · ohio · virginia · frankfurt · singapore)
# ============================================================
services:
  - type: web
    name: backend-e-online
    runtime: python
    # ⚠️ មិនដាក់ `pythonVersion:` ទេ — Blueprint Schema បដិសេធ (additionalProperties: false)
    #    Python Version កំណត់ដោយឯកសារ `.python-version` (= 3.12) នៅ root នៃ repo
    region: singapore          # ជិតកម្ពុជាជាងគេ (oregon · ohio · virginia · frankfurt · singapore)
    # ⚠️ បើ Service មានរួច ហើយនៅ Region ផ្សេង → Render មិនអនុញ្ញាតប្តូរ Region ទេ
    #    (ត្រូវបង្កើត Service ថ្មី ឬលុបបន្ទាត់ `region:` នេះចេញ)
    plan: free                 # ប្តូរទៅ `starter` បើចង់បន្ថែម Persistent Disk (OPTION B)
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # --workers 1 : WebSocket manager ស្ថិតក្នុង Memory -> ត្រូវការ Single Instance
    # --proxy-headers : Render ជា Reverse Proxy (ត្រូវអាន X-Forwarded-*)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health

    # ============================================================
    # OPTION B — Persistent Disk (ត្រូវការ Plan `starter` ឡើងទៅ · Free មិនគាំទ្រ)
    # ដោះ Comment ៤ បន្ទាត់ខាងក្រោម + ដោះ Comment `SQLITE_PATH`/`UPLOAD_DIR` ក្នុង envVars
    # ============================================================
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      # Render កំណត់ RENDER=true ដោយស្វ័យប្រវត្តិ
      - key: SECRET_KEY
        generateValue: true
      # 🗄️ Database = SQLite (គ្មាន `DATABASE_URL` / `DB_ENGINE` ទៀតទេ)
      # Free plan គ្មាន Disk -> ឯកសារ DB ស្ថិតក្នុង Service Folder (Ephemeral)
      # ⚠️ ទិន្នន័យបាត់ពេល Redeploy/Restart — ប្រើ OPTION B (Disk) ដើម្បីកុំបាត់
      #
      # OPTION B (Starter + Disk) — ដោះ Comment ២ ប្លុកខាងក្រោម + `disk:` ខាងលើ
      # - key: SQLITE_PATH
      #   value: /var/data/ecommerce.db
      # - key: UPLOAD_DIR
      #   value: /var/data/uploads
      # 👤 Admin ដំបូង — បង្កើតដោយស្វ័យប្រវត្តិពេល Startup
      # (ចាំបាច់លើ Free plan ព្រោះគ្មាន Shell ដើម្បីរត់ `create_admin.py`)
      # ឧ. ADMIN_EMAIL=admin@mystore.com · ADMIN_PASSWORD=ពាក្យសម្ងាត់វែងៗ
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # CORS — Origin របស់ Frontend (Vercel) · មិនមែន Secret -> ដាក់តម្លៃជាមុនបាន
      - key: CORS_ORIGINS
        value: "https://frontend-user-e-online.vercel.app,https://frontend-admin-e-online.vercel.app"
      # Regex សម្រាប់ Vercel Preview URL ដែលផ្លាស់ប្តូររាល់ពេល Deploy
      - key: CORS_ORIGIN_REGEX
        value: '^https://frontend-(user|admin)-e-online.*\.vercel\.app$'
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_USE_SSL
        sync: false
      # Brevo HTTP API — ផ្ញើ Email តាម HTTPS (ដំណើរការលើ Render free tier ព្រោះ port 587 បិទ)
      - key: BREVO_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # Cloudinary — រក្សាទុករូបភាព/វីដេអូ Upload ឱ្យមានស្ថេរភាព
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # UploadThing — ផ្ទុករូបភាព/វីដេអូ Upload លើ CDN អចិន្ត្រៃយ៍
      - key: UPLOADTHING_TOKEN
        sync: false
      # ABA Pay / KHQRcc — Scan & Pay QR
      - key: KHQRCC_PROFILE_ID
        sync: false
      - key: KHQRCC_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://frontend-user-e-online.vercel.app
