# ============================================================
# Render Blueprint — Deploy Backend (FastAPI) លើ Render
# ============================================================
# របៀបប្រើ:
#   1. Push code ទៅ GitHub (ធានាថា render.yaml នេះនៅ root នៃ repo)
#   2. Render Dashboard -> New -> Blueprint -> ជ្រើស repo នេះ
#   3. Render នឹងបង្កើត Web Service ដោយស្វ័យប្រវត្តិ
#   4. ចូលទៅ Service -> Environment ហើយបំពេញ env vars ដែលមាន `sync: false`
#      (SECRET_KEY, DATABASE_URL, DATABASE_URL_INTERNAL, SMTP_*, TELEGRAM_*, DEEPSEEK_API_KEY, CORS_ORIGINS)
#
# ចំណាំ៖
#   - Free/Starter plan មិនមាន Persistent Disk ទេ -> រូបភាព Upload នឹងបាត់ពេល Redeploy
#   - បើចង់រក្សារូបភាព ប្រើ plan ដែលគាំទ្រ Disk ហើយបន្ថែម disk + UPLOAD_DIR
#   - WebSocket real-time ត្រូវការ Single Instance តែប៉ុណ្ណោះ
#     (កុំ Scale ទៅច្រើន instance ព្រោះ connection manager ស្ថិតក្នុង Memory)
services:
  - type: web
    name: backend-e-online
    runtime: python
    pythonVersion: 3.12.8
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # --workers 1 : WebSocket manager ស្ថិតក្នុង Memory -> ត្រូវការ Single Instance
    # --proxy-headers : Render ជា Reverse Proxy (ត្រូវអាន X-Forwarded-*)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    # បើចង់រក្សាទិន្នន័យ SQLite + រូបភាព Upload លើ Render (ត្រូវការ Plan ដែលមាន Disk)៖
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      # Render កំណត់ RENDER=true ដោយស្វ័យប្រវត្តិ
      - key: SECRET_KEY
        generateValue: true
      # Origin ដែលអនុញ្ញាតឱ្យភ្ជាប់មក API (ញែកដោយសញ្ញាក្បៀស)
      # ឧ. https://frontend-user-e-online.vercel.app,https://frontend-admin-e-online.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # ជាជម្រើស: Regex សម្រាប់ Vercel Preview URL ដែលផ្លាស់ប្តូររាល់ពេល Deploy
      # ឧ. ^https://frontend-(user|admin)-e-online.*\.vercel\.app$
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_INTERNAL
        sync: false
      # SQLite (ជម្រើសជំនួស PostgreSQL) — បើចង់ប្រើ ត្រូវបន្ថែម Persistent Disk
      # រួចទុក DATABASE_URL ទទេ ហើយកំណត់ SQLITE_PATH=/var/data/ecommerce.db
      - key: SQLITE_PATH
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_USE_SSL
        sync: false
      # Brevo HTTP API — ផ្ញើ Email តាម HTTPS (ដំណើរការលើ Render free tier ព្រោះ port 587 អាចបិទ)
      - key: BREVO_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # Cloudinary — រក្សាទុករូបភាព/វីដេអូ Upload ឱ្យមានស្ថេរភាព
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # UploadThing — ផ្ទុករូបភាព/វីដេអូ Upload លើ CDN អចិន្ត្រៃយ៍
      - key: UPLOADTHING_TOKEN
        sync: false
      # ABA Pay / KHQRcc — Scan & Pay QR
      - key: KHQRCC_PROFILE_ID
        sync: false
      - key: KHQRCC_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # ថតរក្សារូបភាព (បើប្រើ Persistent Disk -> UPLOAD_DIR=/var/data/uploads)
      - key: UPLOAD_DIR
        sync: false
